name: stuchka
description: "Stučka 劳动纠纷智能体 · Flutter 桌面工作台外壳（通道 B IPC + 三栏工作台 + 无障碍底线）。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0-200.1.beta
  flutter: ">=3.40.0-0.0.pre"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理（Riverpod 3 — Notifier API）
  flutter_riverpod: ^3.3.1

  # 路由（go_router 17 — state.pathParameters / state.uri.queryParameters）
  go_router: ^17.2.3

  # 唯一图标库 · Lucide line icons（零 Emoji / 零 Material Icons）
  flutter_lucide: ^1.11.0

  # 通道 B HTTP（Bearer 强制注入）
  dio: ^5.9.2

  # 通道 B Yjs WS（ws://127.0.0.1:<port>/ws/sync/:doc_id）
  web_socket_channel: ^3.0.3

  # 三栏可调宽工作台
  multi_split_view: ^3.6.2

  # 胜诉成本水平条形图（非饼图）
  fl_chart: ^1.0.0

  # 跟随系统深色护眼
  dynamic_color: ^1.8.1

  # 本地零外发日志
  logger: ^2.7.0

  # ISO 日期 / 金额格式化
  intl: ^0.20.2

  # 本地偏好（theme_mode / text_scale_factor / case_pane_ratio / 向导完成 / 上云记忆）
  shared_preferences: ^2.5.3
  webview_windows: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # .msix packaging (deploy/01 §1.5). Pinned ^3.16.x per deploy/00 §0.7 baseline.
  # Consumed only by `dart run msix:create` (scripts/build/build_msix.ps1); it does not
  # participate in `flutter analyze` / `flutter test`, so it never affects the existing
  # 64 widget tests. The signing certificate is the OV/EV seam (see sign-windows.ps1).
  msix: ^3.16.7

  # 仅测试用：web_socket_channel 的底层抽象。S1 的 yjs_ws_provider_test 用其真实的
  # AdapterWebSocketChannel 构造一个“连接挂起”的真实 WebSocketChannel（非 mock），
  # 以便在不开真实 socket 的前提下断言 Authorization Bearer 头。
  web_socket: ^1.0.1
  # custom_lint 防线1（spec 01 §1.8）：avoid-hardcoded-colors + forbid-emoji-in-string-literal。
  # 规则实现是真实代码，落在本仓本地 plugin 包 `tools/lints/`（custom_lint_builder 0.8.x）。
  #
  # 为什么这里被注释：custom_lint 0.8.x 依赖 analyzer ^8.4.0，会把本工程从 Dart 3.11 beta SDK
  # 自带的 analyzer 9.0.0 降级到 8.4.0。实测该插件能加载并 `dart run custom_lint` 退出 0，但在
  # 此 beta 分析服务器上 *不能确定性地产出诊断*（registry visitor 静默 no-op）。为不让一个无法
  # 稳定触发的插件拖累整条 beta-native 工具链（且避免跨机非确定性），按 HARD CONSTRAINT 的回退路径
  # 处置：保留真实规则代码 + 本注释说明原因，并由 test/lint/ 的扫描式测试（防线2/3 + 新增 token/
  # emoji 扫描）作为今天的权威 enforcement。待 custom_lint 跟上 analyzer 9.x 后取消本段注释即可。
  #
  # 启用方式（toolchain 支持后）：取消下三行注释 + 在 tools/lints 与本工程各 `dart pub get`，
  # 然后在 analysis_options.yaml 取消 custom_lint: 段注释。
  # custom_lint: ^0.8.1
  # custom_lint_builder: ^0.8.1
  # analyzer: ^8.4.0
  # stuchka_lints:
  #   path: tools/lints

# .msix packaging config (deploy/01-windows-build.md §1.5). Consumed by `dart run msix:create`.
# architecture x64; store:false (Store listing gated on L0-02). logo_path is a documented SEAM:
# the brand logo PNG is supplied at release time; msix:create only reads it at package time, so
# its absence never breaks `flutter analyze`/`flutter test`.
msix_config:
  display_name: Stučka
  publisher_display_name: Stučka 项目方
  identity_name: cn.stuchka.desktop
  msix_version: 0.1.0.1
  publisher: CN=Stuchka Foundation, O=Stuchka Foundation, C=CN
  logo_path: assets/icons/logo.png
  capabilities: internetClient, removableStorage
  architecture: x64
  store: false
  enable_at_startup: false
  app_uri_handler_hosts: stuchka.cn
  languages: zh-cn

flutter:
  uses-material-design: true

  assets:
    - assets/tokens/tokens.base.json
    - assets/tokens/tokens.light.json
    - assets/tokens/tokens.dark.json
    - assets/tokens/tokens.print.json
    - assets/web/editor/

  # 思源 / JetBrains 字体本地打包（spec 01 §1.4 — 全部 SIL OFL，可再分发；禁运行时联网拉取）。
  #
  # 为保证“无 OTF 也能构建绿灯”的跨机兼容（HARD CONSTRAINT），字体的 OTF/TTF 不入 git，
  # 而由 tools/fetch_fonts.dart（或 fetch_fonts.ps1）从官方 OFL 发布源下载到 assets/fonts/。
  # Flutter 在声明的 font asset 缺位时 *构建会失败*，因此 fonts: 段保持注释，待 fetch 脚本
  # 把 OTF 落齐后由开发者取消注释；StuchkaTheme.fontFamily 在缺位时回退系统字体（graceful
  # fallback，见 lib/theme/stuchka_theme.dart 的 fontFamily 注释）。tools/fetch_fonts.dart
  # 在写入字体后会自动把下面的 fonts: 段写回 pubspec.yaml（幂等）。
  #
  # --- BEGIN STUCHKA FONTS (managed by tools/fetch_fonts.dart) ---
  # fonts:
  #   - family: SourceHanSans
  #     fonts:
  #       - asset: assets/fonts/SourceHanSansSC-Regular.otf
  #       - asset: assets/fonts/SourceHanSansSC-Medium.otf
  #         weight: 500
  #       - asset: assets/fonts/SourceHanSansSC-Bold.otf
  #         weight: 700
  #   - family: SourceHanSerif
  #     fonts:
  #       - asset: assets/fonts/SourceHanSerifSC-Regular.otf
  #       - asset: assets/fonts/SourceHanSerifSC-Bold.otf
  #         weight: 700
  #   - family: JetBrainsMonoSC
  #     fonts:
  #       - asset: assets/fonts/JetBrainsMono-Regular.ttf
  # --- END STUCHKA FONTS ---
