# M1 诊断问诊树 (prd/04 §4.1.4) — 数据驱动决策树，≤7 问，每条路径终止于 85 子类之一。
#
# 结构:
#   nodes: 节点表，按 id 索引。根节点 id = "root"。
#   每个节点二选一:
#     - 问题节点 (question): 携带 prompt_zh + answers[]，每个 answer { value, label_zh, next }
#       next 指向另一个节点 id (问题或叶子)。
#     - 叶子节点 (leaf): 携带 subcategory (LD-NN-NN)。
#
# 不变量 (tests/diagnosis_tree.rs 强制):
#   1. 每个 answer.next 必须指向存在的节点。
#   2. 每条从 root 出发的路径深度 ≤ 7 (问题数，根 = 第 1 问)。
#   3. 每条路径最终到达 leaf，且 leaf.subcategory 是 85 子类之一。
#   4. 无环。
#   5. 85 子类全部可达 (做能用以上覆盖, prd §4.1.5)。
#
# 设计: 第 1 问按 20 大类的争议焦点分流到大类子树；大类内 1-5 个区分问触达子类。
# 最长路径 (LD-05 工伤) = 1(root) + 区分问，控制在 7 以内。

root:
  question:
    prompt_zh: 您的劳动纠纷主要围绕以下哪一类核心问题
    answers:
      - { value: contract_formation, label_zh: 劳动合同订立（未签合同/试用期/条款/入职欺诈/服务期）, next: q_ld01 }
      - { value: termination, label_zh: 解除或终止劳动合同（违法解除/裁员/补偿）, next: q_ld02 }
      - { value: wage, label_zh: 工资报酬（拖欠/克扣/最低工资/提成/凭证）, next: q_ld03 }
      - { value: social_insurance, label_zh: 社会保险（未缴/欠缴/基数/转移）, next: q_ld04 }
      - { value: work_injury, label_zh: 工伤与职业病, next: q_ld05 }
      - { value: non_compete, label_zh: 竞业限制与商业秘密, next: q_ld06 }
      - { value: dispatch, label_zh: 劳务派遣, next: q_ld07 }
      - { value: special_protection, label_zh: 女职工与未成年工特殊保护, next: q_ld08 }
      - { value: rest_leave, label_zh: 休息休假与加班, next: q_ld09 }
      - { value: relation_confirm, label_zh: 劳动关系确认, next: q_ld10 }
      - { value: collective, label_zh: 集体劳动争议, next: q_ld11 }
      - { value: part_time, label_zh: 非全日制用工, next: q_ld12 }
      - { value: new_employment, label_zh: 新就业形态（平台/外卖/网约车）, next: q_ld13 }
      - { value: cross_border, label_zh: 跨境与涉外劳动, next: q_ld14 }
      - { value: retired_rehired, label_zh: 退休返聘与超龄用工, next: q_ld15 }
      - { value: ai_automation, label_zh: AI与自动化技术替代岗位, next: q_ld16 }
      - { value: remote_work, label_zh: 远程办公与混合工作, next: q_ld17 }
      - { value: monitoring_privacy, label_zh: 数字监控与职场隐私, next: q_ld18 }
      - { value: algorithm_mgmt, label_zh: 算法管理与劳动权益, next: q_ld19 }
      - { value: livestream, label_zh: 直播电商与自媒体从业, next: q_ld20 }

