# cargo-deny config for hsd — D4 physical isolation (ai/04 §4.9, ai/05 §5.10 hsd_isolation).
#
# Run from this crate dir:  cargo deny --manifest-path Cargo.toml check bans
# The [bans] section red-flags any Python bridge / ONNX / Torch / network / async-runtime crate in
# the hsd dependency tree. tests/isolation.rs enforces the same set inside `cargo test`.
# candle (R1b) is deferred this round, so it is also banned from the current R1a tree.

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = false

[bans]
multiple-versions = "allow"
wildcards = "allow"

# Any of these appearing in the hsd tree is a hard error (D4).
deny = [
    { name = "pyo3" },
    { name = "cpython" },
    { name = "onnxruntime" },
    { name = "ort" },
    { name = "tch" },
    { name = "torch-sys" },
    { name = "candle-core" },
    { name = "candle-nn" },
    { name = "candle-transformers" },
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "isahc" },
    { name = "hf-hub" },
    { name = "tokio" },
    { name = "axum" },
    { name = "actix-web" },
    { name = "rocket" },
    { name = "tonic" },
    { name = "tower-http" },
    { name = "sqlx" },
]

[advisories]
yanked = "deny"

[licenses]
# Workspace is GPL-3.0-only (W3); permit the common permissive licenses of leaf deps.
allow = [
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
