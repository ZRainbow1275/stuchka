[package]
name = "sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# sync = Yjs CRDT (yrs) + WebSocket Provider (frame-level, axum-free) + mDNS LAN discovery +
# .stuchka-patch encode/decode + ProseMirror Step audit double-write (master-index §0.4 / INV-06).
#
# Cross-crate reconciliation rulings applied here:
#   W2  time = chrono (DateTime<Utc>), NOT jiff (the spec's jiff::Timestamp is overridden).
#   W7  sha2 0.10 / sqlx 0.8 (runtime API only, no query! macros, no DATABASE_URL).
#   §E  ed25519-dalek 2.1 is the signature scheme of record (minisign reserved for upgrade
#       packages, not patches — resolves spec self-contradiction I-6).
#
# Version note (constraint #10): the 0529 spec wrote yrs 0.21 / mdns-sd 0.11; current crates.io
# stable is yrs 0.26 / mdns-sd 0.20. The core CRDT surface the brief names
# (Doc / Transact / MapRef / ArrayRef / XmlFragmentRef / Update::decode_v2 /
# encode_state_as_update_v2 / state_vector) is stable across that range, so we pin to verified
# current-stable per the dispatch instruction ("use verified current-stable versions where the
# brief flags spec versions as outdated").
#
# Note on db: the brief places the Doc/Step/Peer repo *contract* "backed by crates/db". Because the
# dispatch constraint scopes edits to this crate dir, sync owns the repo traits + a real,
# self-contained SQLite implementation (sqlx runtime API, W7) over a shared SqlitePool, so sync does
# not link crates/db directly; api injects a `&dyn DocRepo` etc. so the implementation can move to
# crates/db later without touching sync's callers (D2 seam).
[dependencies]
data-model = { workspace = true }
audit = { workspace = true }

yrs = "0.26"
mdns-sd = "0.20"
ed25519-dalek = "2.1"
bs58 = "0.5"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time"] }
