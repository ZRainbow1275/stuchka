[package]
name = "db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# db is the sqlx dual-dialect access layer (master-index §0.4 / D2).
# Runtime SQLite is the R1 main store; Postgres DDL is kept as a draft for R (D2 §2.11).
# Audit is NOT in the main store — it lives in an independent audit.sqlite (D3).
#
# sqlx is used via its RUN-TIME API only (query / query_as / query_scalar); the
# compile-time query! macros are never used so the build is hermetic (no DATABASE_URL).
# data-model is depended on with its optional "sqlx" feature enabled so its FromRow/Type
# derives are available here (INV-01: rule-engine never enables it).
[dependencies]
data-model = { workspace = true, features = ["sqlx"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "rust_decimal",
] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros"] }
