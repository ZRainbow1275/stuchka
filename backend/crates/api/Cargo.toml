[package]
name = "api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# api is the axum HTTP + WebSocket IPC layer (D1): READY handshake + Bearer middleware +
# the full R1 route skeleton (contract-accurate; unimplemented module logic returns 501
# E_NOT_IMPLEMENTED). It is both a library (handlers/state, for integration tests) and a
# binary (src/main.rs, the forked child process).
[lib]
name = "api"
path = "src/lib.rs"

[[bin]]
name = "stuchka-core"
path = "src/main.rs"

[dependencies]
data-model.workspace = true
# Aliased to `stuchka_core` so the workspace `core` crate does not shadow std `core`
# (the `#[tokio::main]` macro expands to `::core::future::*` paths). Direct path because the
# `package`/`workspace = true` combo must match the workspace key, which is `core`.
stuchka-core = { path = "../core", package = "core" }
db.workspace = true
sync.workspace = true
crypto.workspace = true
hsd.workspace = true
rule-engine.workspace = true
ai-dispatcher.workspace = true
kb.workspace = true
document.workspace = true
audit.workspace = true

axum = { version = "0.7", features = ["ws", "multipart"] }
# async-trait: the ai-dispatcher `RoutingAuditSink` trait is `#[async_trait]` (object-safe `dyn`),
# implemented here by `AuditLogRoutingSink` over the audit hash chain (compliance/02 §6).
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
subtle = "2"
base64 = "0.22"
blake3 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "multipart"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v7"] }
