# stuchka-kb/.github/workflows/publish.yml  (deploy/04 4.3.1)
# Belongs to the SEPARATE github.com/stuchka/stuchka-kb repository -- see README.md in this dir.
name: Publish KB to Pages

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'manifest.json'
      - 'releases/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate schemas
        run: |
          npm ci
          npm run validate-schemas
      - name: Build static site
        run: |
          mkdir -p _site
          cp -r content _site/
          cp manifest.json manifest.json.asc _site/
          cp -r releases _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  purge-cdn:
    needs: deploy
    runs-on: ubuntu-22.04
    steps:
      - name: Purge jsDelivr cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/stuchka/stuchka-kb@main/manifest.json"
          curl -s "https://purge.jsdelivr.net/gh/stuchka/stuchka-kb@main/manifest.json.asc"
