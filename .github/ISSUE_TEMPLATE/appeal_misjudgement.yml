name: 申诉误判 (Appeal a misjudgement)
description: 如果你的 Issue 被关键词机器化拦截（标记 dispute-not-accepted）且你认为属于误判，请用本模板复议。
title: "[appeal] 申诉误判: "
labels: ["appeal"]
body:
  - type: markdown
    attributes:
      value: |
        ## 关于申诉误判
        本项目使用关键词 + 正则自动识别个案咨询 / 个人信息 / 教唆违规，并自动关闭这类 Issue。
        机器判断**可能误伤**正常的工程类问题。本模板是 spec §5.5 兜底的"申诉误判"入口，
        确保被拦截的用户始终拥有复议路径。

        本模板**不会**被自动拦截关闭。请如实说明你的原始 Issue 为何属于工程 / 合规 / 治理范畴。
        请勿在申诉中重新填写被拦截的个人信息。
  - type: input
    id: original
    attributes:
      label: 被拦截的原始 Issue 链接或编号
      description: 例如 #123 或完整链接。
      placeholder: "#123"
    validations:
      required: true
  - type: dropdown
    id: intended
    attributes:
      label: 你原始 Issue 的真实类别
      options:
        - bug 缺陷报告
        - feature 功能建议
        - question 工程类提问
        - compliance 合规反馈
        - governance 治理议题
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 为什么这是误判
      description: 说明为何你的 Issue 不属于个案咨询 / 个人信息 / 教唆违规。请勿重复粘贴被拦截的敏感内容。
    validations:
      required: true
  - type: checkboxes
    id: ack
    attributes:
      label: 确认
      options:
        - label: 我确认本申诉不包含个人信息（手机号、身份证号、银行卡号、家庭住址）。
          required: true
        - label: 我理解维护者会人工复核本申诉；若复核确认属于个案咨询，仍会被关闭。
          required: true
